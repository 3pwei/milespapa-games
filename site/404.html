<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>找不到這個遊戲｜Milespapa Games</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f6f2;
        --fg: #1d1c19;
        --muted: #5f5b53;
        --accent: #8a3a22;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141311;
          --fg: #efece5;
          --muted: #a8a299;
          --accent: #e0916f;
        }
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 0 16px;
        background: var(--bg);
        color: var(--fg);
        font: 17px/1.7 system-ui, "Noto Sans TC", sans-serif;
      }
      main {
        max-width: 32rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.6rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
      }
      a {
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>找不到這個遊戲</h1>
      <p>網址可能打錯了，或這個遊戲已經搬家。</p>
      <a href="https://milespapa.com/projects">看看 Milespapa 的所有專案</a>
    </main>
  </body>
</html>
