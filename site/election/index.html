<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#9eb39b"><title>拜託，投我！｜一間總部的開始</title><link rel="canonical" href="https://games.milespapa.com/election/"><link rel="stylesheet" href="rpg.css?v=6e30c8afaa98d621"></head><body>
<canvas id="game" aria-label="競選經營 RPG 遊戲場景。方向鍵或 WASD 移動，E 互動，B 布置，R 旋轉。"></canvas>
<div id="game-ui"><div id="hud" hidden><div class="scene-ribbon"><strong id="scene-name">你的競選總部</strong><span id="day-label">準備日</span></div><div class="hud-pills"><span>經費 <b id="money">18</b></span><span>體力 <b id="energy">4 / 4</b></span><span>夥伴 <b id="workers">0</b></span><span id="vote-pill" hidden>領先 <b id="votes">2 / 9</b></span></div></div>
<section id="district-card" hidden aria-label="目前選區資訊"><button id="district-toggle" onclick="toggleDistrictCard()" aria-label="展開選區資訊" aria-expanded="false" aria-controls="district-details"><b id="district-name"></b><span id="district-arrow" aria-hidden="true">▾</span></button><div id="district-details" hidden><small>選區詳情 · 模擬資料</small><div>人口 <span id="district-pop"></span></div><div class="support-row">我方 <strong id="district-support"></strong> <span>周岳 <b id="district-foe"></b></span></div><div class="support-row">林晴 <b id="district-foe2"></b></div><div class="support-track"><i id="district-bar"></i></div><small id="district-age"></small><small id="cell-summary"></small><div class="district-actions"><button onclick="showDistricts()">各區總覽</button><button onclick="showCellInfo(Math.round(player.x),Math.round(player.y))">所在格資料</button></div></div></section>
<div id="influence-panel" hidden><span id="influence-copy"></span><button id="influence-enter" onclick="returnOffice()">進入總部</button><button onclick="clearInfluence()" aria-label="關閉影響範圍">×</button></div>
<div id="quest" hidden><small>眼前的一小步</small><b id="quest-title">讓空總部開始運轉</b><span id="quest-copy"></span></div>
<div id="location-hint" hidden>點地板移動 · 方向鍵 / WASD · E 互動</div>
<button id="home-btn" onclick="quickReturnOffice()" aria-label="返回總部" title="返回總部" hidden><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M4 14 16 4l12 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 13v14h7v-9h5v9h6V13" fill="currentColor" fill-opacity=".15" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg></button>
<button id="menu-toggle" onclick="toggleGameMenu()" aria-label="開啟遊戲選單" aria-expanded="false" aria-controls="game-drawer" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>選單</span></button>
<aside id="game-drawer" aria-label="遊戲選單" hidden><div class="drawer-heading">遊戲選單</div><nav id="controls" aria-label="遊戲操作" hidden><button id="interact-btn" onclick="interactNearest()">交談 / 互動 <kbd>E</kbd></button><button id="build-btn" onclick="openBuildMenu()">家具布置 <kbd>B</kbd></button><button id="recruit-btn" onclick="openRecruitment()">幕僚與徵才</button><button id="donate-btn" onclick="collectDonations()">小額募款</button><button id="follow-btn" onclick="focusPlayer()" hidden>回到人物</button><button id="map-btn" onclick="toggleOverview()" hidden>看地圖 <kbd>M</kbd></button><button id="whole-map-btn" onclick="showWholeCity()" hidden>全城總覽</button><button id="end-btn" onclick="askEndDay()">收工</button><button onclick="pendingStreetEvents()">街坊事件</button><button onclick="showDistricts()">選區總覽</button><button onclick="inspectGrid()">查看格子資料</button><button onclick="openJournal()" aria-label="選戰日誌">日誌</button><button onclick="showControls()" aria-label="操作說明">？</button></nav>
<div id="zoom-controls" hidden aria-label="畫面縮放"><button onclick="zoomView(1.2)" aria-label="放大畫面">＋</button><button id="zoom-value" onclick="resetZoom()" aria-label="重設縮放">100%</button><button onclick="zoomView(1/1.2)" aria-label="縮小畫面">－</button></div>
</aside>
<button id="cancel-placement" onclick="cancelBuild()" aria-label="取消設立分部" title="取消設立分部" hidden>✕</button>
<div id="placement-ui" hidden><span id="placement-name"></span><button onclick="rotatePlacement()" id="rotate-btn">旋轉 <kbd>R</kbd></button><button onclick="cancelBuild()">完成布置 / 取消 <kbd>Esc</kbd></button><small id="placement-tip">點地板擺放</small></div>
<section id="title-screen"><div class="title-kicker">一間空總部，一整座城市。</div><h1>拜託，<br>投我！</h1><p>把一把鑰匙、18 點經費，<br>變成這座城市願意相信的故事。</p><button class="start-button" onclick="newJourney()">從空總部開始 →</button><button id="continue-btn" onclick="continueJourney()" hidden>繼續這段旅程</button><small>RPG 經營喜劇 · 可用鍵盤，也能點擊移動</small></section>
<div id="modal-shade" hidden aria-hidden="true"></div><button id="hospital-rest" onclick="finishHospital()" hidden>休息一天後出院</button>
<section id="dialogue" role="dialog" aria-modal="true" aria-labelledby="speaker" hidden><div id="portrait"></div><div class="dialogue-content"><small id="dialogue-kicker">你的心聲</small><h2 id="speaker">候選人</h2><p id="speech"></p><div id="choices"></div></div></section>
<section id="menu" role="dialog" aria-modal="true" aria-labelledby="menu-title" hidden><div class="menu-top"><div><small id="menu-kicker">隨身記事本</small><h2 id="menu-title"></h2></div><button onclick="closeMenu()" aria-label="關閉選單">×</button></div><div id="menu-body"></div><div id="menu-message" role="status"></div></section>
<div id="toast" role="status"></div><div id="fade" aria-hidden="true"><div class="door-mascot">✦</div><span id="fade-copy"></span></div></div>
<script src="world.js?v=6e30c8afaa98d621"></script><script src="events.js?v=6e30c8afaa98d621"></script><script src="model.js?v=6e30c8afaa98d621"></script><script src="art.js?v=6e30c8afaa98d621"></script><script src="render.js?v=6e30c8afaa98d621"></script><script src="app.js?v=6e30c8afaa98d621"></script></body></html>
